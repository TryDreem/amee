# Ports come from .env.local, which scripts/wt-env.sh generates per worktree.
# COMPOSE_PROJECT_NAME is also set there, so each worktree gets its own containers.
services:
  # PostgreSQL from the MVP, not SQLite (architecture.md §2.1) — the app's
  # database of record. Not optional, not profile-gated, same as rabbitmq.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amee
      POSTGRES_PASSWORD: amee
      POSTGRES_DB: amee
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amee"]
      interval: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 5

  # Optional. Cache / rate-limit counters / job-status push only.
  # NEVER a source of truth for anything (api-contract §14).
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  # Named, not bind-mounted — COMPOSE_PROJECT_NAME namespaces this per worktree,
  # same isolation as the containers themselves.
  postgres_data:
