[project]
name = "amee-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "celery>=5.4",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  # Export burn-in renders the frontend's own CaptionOverlay headless (INVARIANTS P9), so this is
  # a runtime dependency of the export worker, not a dev/test tool. The Chromium binary itself is
  # not on PyPI — `playwright install chromium` fetches it separately (see README).
  "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  # Reads the alpha channel of rendered caption frames. Test-only, but not optional: without a
  # real pixel check, an opaque render surface passes every structural assertion (valid PNG, right
  # dimensions, expected text) and still covers the entire video once composited - which is
  # exactly the regression this dependency exists to catch.
  "pillow>=10.0",
]
# Real whisperx pulls torch + the CUDA wheel stack (multiple GB) even though
# app/integrations/whisperx.py only runs on device="cpu" — not worth it for
# CI, which never loads a real model anyway (transcribe_video is mocked in
# every test; tests/conftest.py stubs the whisperx import itself so the ml
# extra isn't even required to collect the test suite). Install this
# locally (`pip install -e ".[dev,ml]"`) to run the real integration.
ml = [
  "whisperx>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "whisperx", "whisperx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# celery.Celery.task isn't typed precisely enough for strict mode to see
# through the decorator — real bug risk here is low (it's one line, wraps an
# already-typed function), not worth losing strict mode repo-wide over.
module = "app.workers.tasks"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole test session, matching how the real app runs
# (one process, one loop) rather than pytest-asyncio's per-test default.
# app/db.py's engine uses NullPool specifically so it *doesn't* need this —
# every checkout is a fresh connection, safe across loops either way — but
# there's no reason to fight the grain of "async def test" = "async def app".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
