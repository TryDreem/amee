name: check
on:
  pull_request:
  push: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amee
          POSTGRES_PASSWORD: amee
          POSTGRES_DB: amee
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U amee"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      # test_transcribe_endpoint.py calls the real POST /transcribe route,
      # which really enqueues via transcribe_task.delay() (not mocked) - it
      # needs a broker to publish to, same as local dev's docker-compose
      # rabbitmq service.
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      # test_redis_integration.py / test_jobs_endpoint.py's progress_percent
      # cases need a real round trip, not just the graceful-degradation path
      # (A3 already covers "Redis absent" separately, on purpose).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      AMEE_DB_URL: postgresql://amee:amee@localhost:5432/amee
      CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
      AMEE_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -e "backend[dev]"
      - name: run migrations
        run: cd backend && alembic upgrade head
      - run: pnpm -C frontend install --frozen-lockfile

      - name: build frontend for headless caption render
        run: pnpm -C frontend build

      - name: install chromium for playwright
        run: cd backend && playwright install --with-deps chromium

      - name: backend
        run: make check-backend
      - name: frontend
        run: make check-frontend

      # Catches the failure mode worktrees cannot: backend changed a schema,
      # frontend merged against the old one, both diffs conflict-free.
      - name: contract drift
        run: make drift
